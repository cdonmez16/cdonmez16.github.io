<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cenk Dönmez</title>
  <meta name="description" content="Research on long-term agricultural experiments, geospatial intelligence, GeoAI and FAIR data infrastructures.">
  <meta name="theme-color" content="#0E1F19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar" id="top">
    <div class="wrap topbar__inner">
      <a class="brand" href="#top" data-bind="site.name">Cenk Dönmez</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Open menu">
        <span></span><span></span>
      </button>
      <nav id="nav" class="nav" aria-label="Main"></nav>
    </div>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <canvas class="hero__canvas" aria-hidden="true"></canvas>
    <div class="wrap hero__inner">
      <div class="hero__text">
        <p class="eyebrow eyebrow--light" data-bind="hero.eyebrow"></p>
        <h1 id="hero-title" class="hero__title" data-bind="hero.title"></h1>
        <p class="hero__lead" data-bind="hero.text"></p>
        <p class="hero__aff" data-bind="hero.affiliation"></p>
        <div class="btn-row" data-slot="hero.buttons"></div>
        <div class="hero__links" data-slot="hero.links"></div>
      </div>
      <figure class="hero__portrait" data-slot="hero.portrait"></figure>
    </div>
    <div class="hero__scroll" aria-hidden="true"><span></span></div>
  </section>

  <div class="networks">
    <div class="wrap networks__inner" data-slot="hero.networks"></div>
  </div>

  <main id="main"></main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span data-bind="site.copyright"></span>
      <span data-bind="site.footerNote"></span>
      <a href="admin/" class="footer__admin">Manage content</a>
    </div>
  </footer>

  <div class="lightbox" hidden>
    <button class="lightbox__close" type="button" aria-label="Close image">×</button>
    <img alt="">
  </div>

  <noscript><p class="wrap" style="padding:40px 0">This site needs JavaScript to load its content.</p></noscript>
  <script src="js/hero.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
