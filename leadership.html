<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Leadership — Cenk Dönmez</title>
  <meta name="description" content="Geospatial and environmental scientist: GeoAI, remote sensing, landscape and environmental assessment, long-term agricultural research, FAIR data infrastructures and knowledge exchange.">
  <meta name="theme-color" content="#0E1F19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
<style>
.leadership-jumps { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; position:relative; z-index:2; }
.leadership-jumps a { display:inline-flex; align-items:center; padding:10px 18px; border:1px solid #9ccbb9; border-radius:999px; color:#e6f3ed; text-decoration:none; font-size:14px; font-weight:600; background:rgba(14,31,25,.55); }
.leadership-jumps a:hover,.leadership-jumps a:focus-visible { background:#9ccbb9; color:#0e1f19; }
#scientific-networks,#scientific-recognition,#peer-review { scroll-margin-top:100px; }
body[data-page="leadership"] .topbar.is-scrolled { background: rgba(14,31,25,.96); }
</style>
</head>
<body data-page="leadership">
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar" id="top">
    <div class="wrap wrap--wide topbar__inner">
      <a class="brand" href="index.html" data-bind="site.name">Cenk Dönmez</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Open menu">
        <span></span><span></span>
      </button>
      <nav id="nav" class="nav" aria-label="Main"></nav>
    </div>
  </header>

  <section class="pagehead" aria-labelledby="page-title">
    <canvas class="hero__canvas" aria-hidden="true"></canvas>
    <div class="wrap pagehead__inner" data-slot="pagehead"></div>
  </section>

  <main id="main"></main>

  <section class="contact dark" id="contact" aria-label="Contact"></section>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span data-bind="site.copyright"></span>
      <span data-bind="site.footerNote"></span>
      <a href="admin/" class="footer__admin">Manage content</a>
    </div>
  </footer>

  <div class="lightbox" hidden>
    <button class="lightbox__close" type="button" aria-label="Close image">×</button>
    <img alt="">
  </div>

  <noscript><p class="wrap" style="padding:40px 0">This site needs JavaScript to load its content.</p></noscript>
  <script src="js/hero.js" defer></script>
  <script src="js/main.js" defer></script>
<script>
(function(){
  const head=document.querySelector('[data-slot="pagehead"]'), main=document.getElementById('main');
  function sync(){
    const text=head.querySelector('.pagehead__text'); if(!text)return;
    const ids=['scientific-networks','scientific-recognition','peer-review'];
    const targets=ids.map(id=>document.getElementById(id)).filter(Boolean);
    const old=text.querySelector('.leadership-jumps');
    const labels=targets.map(s=>s.querySelector('h2')?.textContent||s.id);
    const signature=JSON.stringify(labels);
    if(old && old.dataset.signature===signature)return;
    if(old)old.remove(); if(!targets.length)return;
    const nav=document.createElement('nav'); nav.className='leadership-jumps'; nav.setAttribute('aria-label','Academic leadership sections'); nav.dataset.signature=signature;
    targets.forEach((s,i)=>{const a=document.createElement('a'); a.href='#'+s.id; a.textContent=labels[i]+' ↓'; nav.appendChild(a);}); text.appendChild(nav);
  }
  const observer=new MutationObserver(sync); observer.observe(head,{childList:true,subtree:true}); observer.observe(main,{childList:true,subtree:true}); sync();
})();
</script>
</body>
</html>
