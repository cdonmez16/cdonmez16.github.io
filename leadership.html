:root{--lead-ink:#183129;--lead-muted:#60726b;--lead-border:#dce5df;--lead-bg:#f5f7f3;--lead-gold:#ad8550}body{background:var(--lead-bg)}.lead-wrap{width:min(1160px,calc(100% - 44px));margin:auto}.lead-header{background:#122d25;color:#f3f6ef;position:relative;overflow:hidden;padding:100px 0 80px}.lead-header:after{content:"";position:absolute;right:-10%;top:-80%;width:70%;aspect-ratio:1;border:1px solid #ffffff20;border-radius:50%;box-shadow:0 0 0 60px #ffffff05,0 0 0 120px #ffffff04,0 0 0 180px #ffffff03;pointer-events:none}.lead-kicker{font:700 11px Inter,sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:#d7bd8d}.lead-header h1{font:500 clamp(43px,6vw,75px)/1.07 'Source Serif 4',Georgia,serif;max-width:820px;margin:20px 0}.lead-header p{max-width:670px;font-size:17px;line-height:1.8;color:#c8d8cf}.lead-index{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px}.lead-index a{border:1px solid #ffffff3b;border-radius:40px;color:#ecf4ed;padding:9px 16px;text-decoration:none;font-size:12px}.lead-index a:hover{background:#ffffff18}.lead-body{padding:35px 0 100px}.lead-section{padding-top:72px;scroll-margin-top:80px}.lead-section-head{display:grid;grid-template-columns:85px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:28px}.lead-number{font:500 37px/1 'Source Serif 4',serif;color:var(--lead-gold)}.lead-section h2{font:500 clamp(29px,3.6vw,42px)/1.2 'Source Serif 4',serif;color:var(--lead-ink);margin:0 0 9px}.lead-section-head p{margin:0;color:var(--lead-muted);line-height:1.7;max-width:760px}.lead-grid:has(> :only-child){grid-template-columns:1fr}.lead-grid:has(> :only-child) .lead-card{display:grid;grid-template-columns:minmax(260px,42%) 1fr}.lead-grid:has(> :only-child) .lead-media{height:100%;min-height:290px}.lead-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:23px}.lead-card{background:white;border:1px solid var(--lead-border);border-radius:5px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s}.lead-card:hover{transform:translateY(-4px);border-color:#b7cbc0;box-shadow:0 15px 36px #1b392214}.lead-media{height:230px;background:#e2ebe4;position:relative;overflow:hidden}.lead-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s}.lead-card:hover .lead-media img{transform:scale(1.035)}.lead-placeholder{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:22px 25px;background:linear-gradient(125deg,#dfe9e0,#f1f3ed);color:#577468;position:relative;overflow:hidden}.lead-placeholder:before{content:"";position:absolute;inset:-60px;background:repeating-radial-gradient(ellipse at 80% 80%,transparent 0 22px,#72948325 23px 24px,transparent 25px 47px);transform:rotate(-9deg)}.lead-placeholder span,.lead-placeholder small{position:relative;z-index:1}.lead-placeholder span{font:600 11px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase}.lead-placeholder small{font:500 13px Inter,sans-serif}.lead-card-content{padding:28px 29px 31px;flex:1}.lead-card-tag{color:#8b744d;font:700 10px Inter,sans-serif;text-transform:uppercase;letter-spacing:1.7px;margin-bottom:12px}.lead-card h3{font:500 27px/1.23 'Source Serif 4',Georgia,serif;color:var(--lead-ink);margin:0 0 18px}.lead-points{padding:0 0 0 18px;margin:0;color:#52665d;font-size:14px;line-height:1.85}.lead-points li{padding-left:4px;margin:0 0 8px}.lead-points li::marker{color:#a27f4e}.lead-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px}.lead-links a{font:600 13px Inter,sans-serif;color:#245d45;text-decoration:none;border-bottom:1px solid #8ab3a0}.lead-note{border-top:1px solid var(--lead-border);padding-top:22px;margin-top:45px;color:#74877b;font-size:13px}.lead-topbar{background:#fff;border-bottom:1px solid #e1e9e2}.lead-topbar-inner{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:20px 24px;gap:20px}.lead-brand{font:600 19px 'Source Serif 4',serif;color:#183129;text-decoration:none;white-space:nowrap}.lead-menu{display:flex;gap:17px;flex-wrap:wrap;align-items:center}.lead-menu a{font:500 12px Inter,sans-serif;color:#40554a;text-decoration:none}.lead-menu a.active{color:#986f39}.lead-toggle{display:none;background:none;border:1px solid #d7e2d9;padding:9px 12px;border-radius:4px;color:#173629}.lead-footer{background:#122d25;color:#dce8df;padding:38px 0;font:13px Inter,sans-serif}.lead-footer a{color:#dce8df}@media(max-width:1100px){.lead-toggle{display:block}.lead-menu{display:none;position:absolute;top:65px;left:0;right:0;background:white;padding:24px;z-index:20;box-shadow:0 15px 25px #0002}.lead-menu.open{display:flex;flex-direction:column;align-items:flex-start}.lead-topbar{position:relative;z-index:30}}@media(max-width:720px){.lead-grid:has(> :only-child) .lead-card{display:flex}.lead-grid:has(> :only-child) .lead-media{height:200px;min-height:0}.lead-header{padding:65px 0 55px}.lead-grid{grid-template-columns:1fr}.lead-section-head{grid-template-columns:1fr;gap:8px}.lead-section{padding-top:50px}.lead-media{height:200px}.lead-card-content{padding:24px}.lead-header p{font-size:15px}}
</style></head><body><a class="skip" href="#main">Skip to content</a><header class="lead-topbar"><div class="lead-topbar-inner"><a class="lead-brand" href="index.html" id="brand">Cenk Dönmez</a><button class="lead-toggle" id="menu-toggle" aria-expanded="false" aria-controls="lead-nav">Menu ☰</button><nav class="lead-menu" id="lead-nav" aria-label="Main navigation"></nav></div></header><section class="lead-header"><div class="lead-wrap"><div class="lead-kicker">Academic portfolio / Scientific community</div><h1 id="page-title">Academic leadership & scientific service</h1><p id="page-intro"></p><nav class="lead-index" id="section-index" aria-label="On this page"></nav></div></section><main id="main" class="lead-wrap lead-body"></main><footer class="lead-footer" id="contact"><div class="lead-wrap"><span id="copyright">© Cenk Dönmez</span> · <a href="admin/">Manage content</a></div></footer><script>
(function(){'use strict';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=u=>{u=String(u||'').trim();return /^(https?:\/\/|mailto:|assets\/|\.\/assets\/|\/assets\/)/i.test(u)?u:''};const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function bullets(text){let t=String(text||'').trim();if(!t)return [];if(/^\s*[-•]\s/m.test(t)){return t.split(/\n+/).map(x=>x.replace(/^\s*[-•]\s*/, '').trim()).filter(Boolean)}let p=t.split(/\s+[—–]\s+/);if(p.length>1)return [p.slice(1).join(' — ')];return [t]}function renderItem(item,i){let img=String(item.image||'').trim();let visual=img?`<img loading="lazy" src="${esc(img)}" alt="${esc(item.title||'Scientific leadership')}" onerror="this.outerHTML='<div class=&quot;lead-placeholder&quot;><span>Image unavailable</span><small>Check the image path in Content Studio</small></div>'">`:`<div class="lead-placeholder"><span>Research / Community / Service</span><small>Add an image in Content Studio</small></div>`;let links=(item.buttons||[]).filter(b=>safeUrl(b.url)).map(b=>`<a href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener">${esc(b.label||'Learn more')} ↗</a>`).join('');return `<article class="lead-card"><div class="lead-media">${visual}</div><div class="lead-card-content"><div class="lead-card-tag">Selected contribution · ${String(i+1).padStart(2,'0')}</div><h3>${esc(item.title)}</h3><ul class="lead-points">${bullets(item.text).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${links?`<div class="lead-links">${links}</div>`:''}</div></article>`}fetch('content/site.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Unable to load content/site.json');return r.json()}).then(data=>{let page=data.pages?.leadership||{};document.getElementById('page-title').textContent=page.title||'Academic leadership & scientific service';document.getElementById('page-intro').textContent=page.intro||'';document.getElementById('brand').textContent=data.site?.name||'Cenk Dönmez';document.getElementById('copyright').textContent=data.site?.copyright||'© Cenk Dönmez';let nav=(data.nav||[]).map(n=>`<a class="${n.url==='leadership.html'?'active':''}" href="${esc(n.url||'#')}">${esc(n.label)}</a>`).join('');document.getElementById('lead-nav').innerHTML=nav;let sections=(data.sections||[]).filter(s=>s.page==='leadership'&&s.visible!==false);document.getElementById('section-index').innerHTML=sections.map((s,i)=>`<a href="#${esc(s.id||slug(s.title))}">${String(i+1).padStart(2,'0')} / ${esc(s.eyebrow||s.title)}</a>`).join('');document.getElementById('main').innerHTML=sections.map((s,i)=>`<section class="lead-section" id="${esc(s.id||slug(s.title))}"><div class="lead-section-head"><span class="lead-number">${String(i+1).padStart(2,'0')}</span><div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p></div></div><div class="lead-grid">${(s.items||[]).map(renderItem).join('')}</div></section>`).join('')+`<p class="lead-note">Images and descriptions can be updated through Content Studio.</p>`}).catch(e=>{document.getElementById('main').textContent=e.message});const b=document.getElementById('menu-toggle'),n=document.getElementById('lead-nav');b.addEventListener('click',()=>{let open=n.classList.toggle('open');b.setAttribute('aria-expanded',String(open))})})();
</script></body></html>
