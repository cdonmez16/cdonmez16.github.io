<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Academic Leadership — Cenk Dönmez</title><meta content="#0e1f19" name="theme-color"/><link href="css/style.css?v=20261123-lead-v4" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:wght@400;500;600&amp;display=swap" rel="stylesheet"/><style>
/* Leadership layout v4: project-page components and spacing. */
body[data-page="leadership"] { background: var(--ground); }
body[data-page="leadership"] .pagehead__inner { padding-top: 168px; padding-bottom: 72px; }
body[data-page="leadership"] .pagehead__text { gap: 16px; }
body[data-page="leadership"] .pagehead__title { font-size: clamp(34px, 4vw, 52px); max-width: 860px; line-height: 1.1; }
body[data-page="leadership"] .pagehead__intro { font-size: 18px; max-width: 720px; }
.lead-kicker { margin: 0; color: var(--mint); text-transform: uppercase; letter-spacing: 1.4px; font-size: 12px; font-weight: 600; }
.lead-body { padding-bottom: 80px; }
.lead-section { padding-top: 80px; scroll-margin-top: 90px; }
.lead-section-head { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--line); display: flex; gap: 20px; align-items: baseline; }
.lead-number { font-family: var(--serif); font-size: 24px; color: var(--accent); min-width: 38px; }
.lead-section h2 { margin: 0 0 8px; font-family: var(--serif); font-size: clamp(30px, 3.4vw, 42px); font-weight: 500; line-height: 1.12; }
.lead-section-head p { margin: 0; color: var(--muted); font-size: 16px; }
/* EXACT project grid width, gaps, image height, and body padding. */
.lead-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.lead-card { min-width: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); transition: transform .45s var(--ease), box-shadow .45s var(--ease), border-color .3s; }
.lead-card:hover { transform: translateY(-6px) scale(1.015); box-shadow: var(--shadow-lift); border-color: rgba(15,92,76,.45); }
.lead-media { height: 180px; flex-shrink: 0; overflow: hidden; background: var(--accent-soft); }
.lead-media img { width: 100%; height: 100%; display: block; object-fit: cover; }
.lead-card-content { padding: 26px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
.lead-card-tag { font-size: 12px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted); }
.lead-card h3 { margin: 0; font-size: 20px; line-height: 1.4; font-weight: 600; }
.lead-points { margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.65; color: var(--muted); }
.lead-points li { margin-bottom: 7px; }
.lead-points li::marker { color: var(--accent); }
.lead-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 8px; }
.lead-links a { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 600; padding: 7px 13px; text-decoration: none; }
.lead-links a:hover { border-color: var(--accent); color: var(--accent); }
.lead-placeholder { height: 100%; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; color: var(--muted); }
.lead-placeholder span { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 600; }
.lead-placeholder small { font-size: 13px; }
.lead-note { margin: 40px 0 0; font-size: 13px; color: var(--muted); }
@media(max-width: 980px) { .lead-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media(max-width: 600px) { .lead-grid { grid-template-columns: minmax(0, 1fr); } .lead-section-head { align-items: flex-start; gap: 10px; } body[data-page="leadership"] .pagehead__inner { padding-top: 120px; padding-bottom: 52px; } }
</style></head><body data-page="leadership"><a class="skip" href="#main">Skip to content</a><header class="topbar" id="top"><div class="wrap wrap--wide topbar__inner"><a class="brand" href="index.html" id="brand">Cenk Dönmez</a><button aria-controls="lead-nav" aria-expanded="false" aria-label="Open menu" class="menu-toggle" id="menu-toggle" type="button"><span></span><span></span></button><nav aria-label="Main" class="nav" id="lead-nav"></nav></div></header><section aria-labelledby="page-title" class="pagehead"><canvas aria-hidden="true" class="hero__canvas"></canvas><div class="wrap pagehead__inner"><div class="pagehead__text lead-head-copy"><p class="lead-kicker">Academic portfolio / Scientific community · layout 4</p><h1 class="pagehead__title" id="page-title">Academic leadership &amp; scientific service</h1><p class="pagehead__intro" id="page-intro"></p></div></div></section><main class="wrap lead-body" id="main"></main><footer class="footer"><div class="wrap footer__inner"><span id="copyright">© Cenk Dönmez</span><span>Academic portfolio</span><a class="footer__admin" href="admin/">Manage content</a></div></footer><script>
(function(){'use strict';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=u=>{u=String(u||'').trim();return /^(https?:\/\/|mailto:|assets\/|\.\/assets\/|\/assets\/)/i.test(u)?u:''};const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function bullets(text){let t=String(text||'').trim();if(!t)return [];if(/^\s*[-•]\s/m.test(t)){return t.split(/\n+/).map(x=>x.replace(/^\s*[-•]\s*/, '').trim()).filter(Boolean)}let p=t.split(/\s+[—–]\s+/);if(p.length>1)return [p.slice(1).join(' — ')];return [t]}function renderItem(item,i){let img=String(item.image||'').trim();let visual=img?`<img loading="lazy" src="${esc(img)}" alt="${esc(item.title||'Scientific leadership')}" onerror="this.outerHTML='<div class=&quot;lead-placeholder&quot;><span>Image unavailable</span><small>Check the image path in Content Studio</small></div>'">`:`<div class="lead-placeholder"><span>Research / Community / Service</span><small>Add an image in Content Studio</small></div>`;let links=(item.buttons||[]).filter(b=>safeUrl(b.url)).map(b=>`<a href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener">${esc(b.label||'Learn more')} ↗</a>`).join('');return `<article class="lead-card"><div class="lead-media">${visual}</div><div class="lead-card-content"><div class="lead-card-tag">Selected contribution · ${String(i+1).padStart(2,'0')}</div><h3>${esc(item.title)}</h3><ul class="lead-points">${bullets(item.text).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${links?`<div class="lead-links">${links}</div>`:''}</div></article>`}fetch('content/site.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Unable to load content/site.json');return r.json()}).then(data=>{let page=data.pages?.leadership||{};document.getElementById('page-title').textContent=page.title||'Academic leadership & scientific service';document.getElementById('page-intro').textContent=page.intro||'';document.getElementById('brand').textContent=data.site?.name||'Cenk Dönmez';document.getElementById('copyright').textContent=data.site?.copyright||'© Cenk Dönmez';let nav=(data.nav||[]).map(n=>`<a class="${n.url==='leadership.html'?'is-active':''}" href="${esc(n.url||'#')}">${esc(n.label)}</a>`).join('');document.getElementById('lead-nav').innerHTML=nav;let sections=(data.sections||[]).filter(s=>s.page==='leadership'&&s.visible!==false);document.getElementById('main').innerHTML=sections.map((s,i)=>`<section class="lead-section" id="${esc(s.id||slug(s.title))}"><div class="lead-section-head"><span class="lead-number">${String(i+1).padStart(2,'0')}</span><div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p></div></div><div class="lead-grid">${(s.items||[]).map(renderItem).join('')}</div></section>`).join('')+`<p class="lead-note">Images and descriptions can be updated through Content Studio.</p>`}).catch(e=>{document.getElementById('main').textContent=e.message});const b=document.getElementById('menu-toggle'),n=document.getElementById('lead-nav');b.addEventListener('click',()=>{let open=n.classList.toggle('is-open');b.setAttribute('aria-expanded',String(open))})})();
</script><script src="js/hero.js?v=20261123-leadership"></script></body></html>
