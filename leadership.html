<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Academic Leadership — Cenk Dönmez</title><meta content="#0e1f19" name="theme-color"/><link href="css/style.css" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:wght@400;500;600&amp;display=swap" rel="stylesheet"/><style>/* Leadership-only layout. All global colours, navigation, hero and card primitives come from css/style.css. */
body[data-page="leadership"] { background:var(--ground); }
.lead-head-copy { max-width:900px; }
.lead-kicker { margin:0; font-size:12px; font-weight:600; letter-spacing:1.7px; text-transform:uppercase; color:var(--mint); }
.lead-index { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
/* Same restrained outlined treatment as the shared dark hero ghost buttons. */
.pagehead .lead-index a, .pagehead .lead-index a:visited {
  display:inline-flex; align-items:center; min-height:38px; padding:8px 15px;
  border:1px solid #5E8577; border-radius:999px; background:transparent;
  color:#fff; text-decoration:none; font-size:12.5px; font-weight:500;
  transition:background .2s,border-color .2s,transform .2s;
}
.pagehead .lead-index a:hover, .pagehead .lead-index a:focus-visible {
  background:rgba(255,255,255,.09); border-color:#fff; color:#fff; transform:translateY(-1px);
}
.lead-body { padding-top:0; padding-bottom:88px; }
.lead-section { padding-top:80px; scroll-margin-top:90px; }
.lead-section-head { display:flex; gap:25px; align-items:flex-start; margin-bottom:34px; }
.lead-number { min-width:76px; font:500 34px/1.15 var(--serif); color:#B1844A; }
.lead-section h2 { margin:0 0 10px; font:500 clamp(30px,3.4vw,42px)/1.13 var(--serif); color:var(--ink); }
.lead-section-head p { margin:0; color:var(--muted); font-size:16px; }
.lead-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }
.lead-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; min-width:0; transition:transform .35s var(--ease),border-color .3s,box-shadow .35s; }
.lead-card:hover { transform:translateY(-5px); border-color:rgba(15,92,76,.45); box-shadow:var(--shadow-lift); }
.lead-media { height:180px; background:var(--accent-soft); overflow:hidden; flex-shrink:0; }
.lead-media img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .7s var(--ease); }
.lead-card:hover .lead-media img { transform:scale(1.05); }
.lead-placeholder { height:100%; padding:19px 21px; display:flex; flex-direction:column; justify-content:space-between; color:var(--muted); background:var(--accent-soft); }
.lead-placeholder span { font-size:11px; letter-spacing:1.2px; text-transform:uppercase; font-weight:600; }
.lead-placeholder small { font-size:13px; }
.lead-card-content { padding:26px; flex:1; display:flex; flex-direction:column; gap:11px; }
.lead-card-tag { font-size:11px; font-weight:600; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); }
.lead-card h3 { margin:0; font:600 20px/1.38 var(--sans); color:var(--ink); }
.lead-points { margin:0; padding-left:18px; font-size:15px; line-height:1.7; color:var(--muted); }
.lead-points li { padding-left:3px; margin-bottom:7px; }
.lead-points li::marker { color:var(--accent); }
.lead-links { display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:8px; }
.lead-links a { display:inline-flex; padding:7px 13px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink-2); font-size:13px; font-weight:600; text-decoration:none; }
.lead-links a:hover { border-color:var(--accent); color:var(--accent); }
.lead-note { margin:40px 0 0; padding-top:18px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
@media(max-width:960px) { .lead-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:600px) { .lead-grid { grid-template-columns:1fr; } .lead-section-head { gap:12px; flex-direction:column; } .lead-section { padding-top:62px; } .lead-card-content { padding:22px; } }

/* Leadership layout alignment with the actual Projects page. */
body[data-page="leadership"] .pagehead__inner { padding-top: 168px; padding-bottom: 72px; gap:40px; }
body[data-page="leadership"] .pagehead__text { max-width: 760px; gap:16px; }
body[data-page="leadership"] .pagehead__title { font-size:clamp(34px,4vw,52px); line-height:1.1; max-width:760px; }
body[data-page="leadership"] .pagehead__intro { font-size:18px; max-width:720px; }
.lead-section-nav { background:var(--ground); border-bottom:1px solid var(--line); }
.lead-section-nav .lead-index { padding-top:14px; padding-bottom:14px; margin:0 auto; gap:24px; }
.lead-section-nav .lead-index a, .lead-section-nav .lead-index a:visited {
  display:inline-flex; align-items:center; min-height:32px; padding:3px 0;
  border:0; border-radius:0; background:transparent; color:var(--muted);
  text-decoration:none; font-size:13px; font-weight:500; transition:color .2s;
}
.lead-section-nav .lead-index a:hover, .lead-section-nav .lead-index a:focus-visible {
  background:transparent; border:0; color:var(--accent); transform:none;
}
.lead-section { padding-top:68px; }
.lead-section-head { gap:16px; margin-bottom:30px; align-items:baseline; }
.lead-number { min-width:42px; font-size:23px; }
.lead-section h2 { font-size:clamp(28px,3.2vw,40px); line-height:1.15; }
.lead-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
@media(max-width:960px) { .lead-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:600px) {
 body[data-page="leadership"] .pagehead__inner { padding-top:120px; padding-bottom:52px; }
 .lead-grid { grid-template-columns:minmax(0,1fr); }
 .lead-section-head { align-items:flex-start; gap:10px; }
 .lead-section { padding-top:56px; }
}

(function(){'use strict';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=u=>{u=String(u||'').trim();return /^(https?:\/\/|mailto:|assets\/|\.\/assets\/|\/assets\/)/i.test(u)?u:''};const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function bullets(text){let t=String(text||'').trim();if(!t)return [];if(/^\s*[-•]\s/m.test(t)){return t.split(/\n+/).map(x=>x.replace(/^\s*[-•]\s*/, '').trim()).filter(Boolean)}let p=t.split(/\s+[—–]\s+/);if(p.length>1)return [p.slice(1).join(' — ')];return [t]}function renderItem(item,i){let img=String(item.image||'').trim();let visual=img?`<img loading="lazy" src="${esc(img)}" alt="${esc(item.title||'Scientific leadership')}" onerror="this.outerHTML='<div class=&quot;lead-placeholder&quot;><span>Image unavailable</span><small>Check the image path in Content Studio</small></div>'">`:`<div class="lead-placeholder"><span>Research / Community / Service</span><small>Add an image in Content Studio</small></div>`;let links=(item.buttons||[]).filter(b=>safeUrl(b.url)).map(b=>`<a href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener">${esc(b.label||'Learn more')} ↗</a>`).join('');return `<article class="lead-card"><div class="lead-media">${visual}</div><div class="lead-card-content"><div class="lead-card-tag">Selected contribution · ${String(i+1).padStart(2,'0')}</div><h3>${esc(item.title)}</h3><ul class="lead-points">${bullets(item.text).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${links?`<div class="lead-links">${links}</div>`:''}</div></article>`}fetch('content/site.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Unable to load content/site.json');return r.json()}).then(data=>{let page=data.pages?.leadership||{};document.getElementById('page-title').textContent=page.title||'Academic leadership & scientific service';document.getElementById('page-intro').textContent=page.intro||'';document.getElementById('brand').textContent=data.site?.name||'Cenk Dönmez';document.getElementById('copyright').textContent=data.site?.copyright||'© Cenk Dönmez';let nav=(data.nav||[]).map(n=>`<a class="${n.url==='leadership.html'?'is-active':''}" href="${esc(n.url||'#')}">${esc(n.label)}</a>`).join('');document.getElementById('lead-nav').innerHTML=nav;let sections=(data.sections||[]).filter(s=>s.page==='leadership'&&s.visible!==false);document.getElementById('section-index').innerHTML=sections.map((s,i)=>`<a href="#${esc(s.id||slug(s.title))}">${String(i+1).padStart(2,'0')} / ${esc(s.eyebrow||s.title)}</a>`).join('');document.getElementById('main').innerHTML=sections.map((s,i)=>`<section class="lead-section" id="${esc(s.id||slug(s.title))}"><div class="lead-section-head"><span class="lead-number">${String(i+1).padStart(2,'0')}</span><div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p></div></div><div class="lead-grid">${(s.items||[]).map(renderItem).join('')}</div></section>`).join('')+`<p class="lead-note">Images and descriptions can be updated through Content Studio.</p>`}).catch(e=>{document.getElementById('main').textContent=e.message});const b=document.getElementById('menu-toggle'),n=document.getElementById('lead-nav');b.addEventListener('click',()=>{let open=n.classList.toggle('is-open');b.setAttribute('aria-expanded',String(open))})})();
</script><script src="js/hero.js?v=20261123-leadership"></script></body></html>
